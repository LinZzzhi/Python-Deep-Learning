[project]
name = "ffind"
version = "0.1.0"
description = "快文件查找器:多进程 scandir 建索引 + SQLite 毫秒级查询"
requires-python = ">=3.10"

[project.scripts]
ffind = "ffinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffinder"]
# 即便被上层 .gitignore 命中,也强制打包前端资源
artifacts = ["ffinder/web/**"]
